name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.diff" "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" -o pr.diff
          head -c 100000 pr.diff > pr.trimmed.diff

      - name: Run AI review
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          echo "You are a senior software engineer performing a code review. Review the git diff. Point out bugs, security issues, and style concerns. Be concise. If the code looks good, say so." > system.txt
          jq -n --rawfile system system.txt --rawfile user pr.trimmed.diff '{model:"openai/gpt-4o-mini",messages:[{role:"system",content:$system},{role:"user",content:$user}],temperature:0.2}' > payload.json
          curl -sL -X POST -H "Authorization: Bearer $MODELS_TOKEN" -H "Content-Type: application/json" "https://models.github.ai/inference/chat/completions" -d @payload.json > response.json
          echo "=== Raw response ==="
          cat response.json
          jq -r '.choices[0].message.content // "AI review could not be generated. See logs for raw response."' response.json > review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --rawfile body review.md '{body: ("## 🤖 AI Code Review\n\n" + $body)}' > comment.json
          curl -sL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -d @comment.json
