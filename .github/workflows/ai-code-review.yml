name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.diff" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -o pr.diff
          head -c 100000 pr.diff > pr.trimmed.diff

      - name: Run AI review
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          SYSTEM_PROMPT="You are a senior software engineer performing a code review. Review the following git diff. Point out bugs, security issues, performance problems, and style concerns. Be concise and reference specific files and lines. If the code looks good, say so."

          jq -n \
            --arg system "$SYSTEM_PROMPT" \
            --rawfile user pr.trimmed.diff \
            '{
              model: "openai/gpt-4o-mini",
              messages: [
                { role: "system", content: $system },
                { role: "user", content: $user }
              ],
              temperature: 0.2
            }' > payload.json

          echo "=== Calling GitHub Models ==="
          RESPONSE=$(curl -sL -X POST \
            -H "Authorization: Bearer $MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://models.github.ai/inference/chat/completions" \
            -d @payload.json)

          echo "=== Raw response ==="
          echo "$RESPONSE"

          echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI review could not be generated. Check logs for the raw API response."' > review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_CONTENT="$(cat review.md)"
          jq -n --arg body "## 🤖 AI Code Review

$BODY_CONTENT" '{ body: $body }' > comment.json

          curl -sL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @comment.json
